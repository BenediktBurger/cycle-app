arb-dir: lib/l10n
# app_en.arb is the template on purpose: gen-l10n fills keys that are missing
# from a locale's ARB with the template's text, so the untranslated-term
# fallback language is English (never German; see docs/adr/0007-language-policy.md).
# New keys therefore land in app_en.arb first and are translated from there
# (currently de is the only other locale).
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
nullable-getter: false
# Generated-code placement: this project generates REAL files into arb-dir
# (lib/l10n, imported as `package:cycle_app/l10n/app_localizations.dart`)
# instead of the deprecated synthetic package:flutter_gen. Historical note:
# the `synthetic-package: false` opt-in switch that was required on older
# Flutter releases is now DEPRECATED — Flutter 3.47 warns `synthetic-package`
# "no longer has any effect" (real files are the only supported behavior), so
# the switch was removed in the 2026-09-15 repair. Keep it out of this file.
# Requires `flutter: generate: true` in pubspec.yaml (see comment there).
