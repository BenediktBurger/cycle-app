name: Pages

# ADR-0012: ships the released web demo to GitHub Pages. Publishing a
# release — or a manual workflow_dispatch run with the ref input below —
# checks out the resolved ref, rebuilds the app under app/, and refreshes
# the landing page from that commit — so /app/ mirrors the published APK,
# and the branches/ subtree owned by pages-branches.yml carries through
# untouched. The current development version lives under branches/main/,
# served by pages-branches.yml. The assembled site is committed straight
# to the gh-pages branch (Pages source "deploy from branch";
# Actions-artifact and branch publishing are mutually exclusive).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build — a tag, a branch name, or a commit SHA (required for manual runs)
        required: true
        type: string

# Shared with pages-branches.yml: both write commits to gh-pages, so runs
# must serialize instead of cancelling each other mid-write.
concurrency:
  group: pages-deploy
  # Several branch deploys may arrive while one run holds the group: queue
  # them all instead of the default single-pending-run replace.
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # On release events GITHUB_SHA points at the default-branch tip, not
    # the released commit — the resolved ref is what selects the build.
    steps:
      - name: Resolve the ref to build
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_REF: ${{ inputs.ref }}
        # The guard fails the run here rather than letting checkout
        # silently fall back to the default branch on an empty ref.
        run: |
          web_ref="${RELEASE_TAG:-$DISPATCH_REF}"
          [ -n "$web_ref" ] || { echo "No ref to build: a release event must carry a tag_name, and a manual run must pass the ref input"; exit 1; }
          echo "WEB_REF=$web_ref" >> "$GITHUB_ENV"

      # persist: false — the publish step below authenticates explicitly.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.WEB_REF }}
          persist-credentials: false

      # Same key as in ci.yml (restore-key semantics commented there):
      # one shared cache entry — an identical-key save here is skipped,
      # not merged.
      - name: Restore pub cache
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('tool/flutter-version') }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ hashFiles('tool/flutter-version') }}-

      # The pinned Flutter version lives in tool/flutter-version (one bare
      # version line under comments) and is read directly — the same file the
      # F-Droid build recipe parses from each built commit, with the same
      # parse. Shell expansion IS possible here: it runs in this run step,
      # then is rendered into the action input below via ${{ }}; the literal
      # flutter-version input is gone, so a Flutter bump edits
      # tool/flutter-version ONLY. (Deliberately no `set -o pipefail`: a
      # comment-only pin file must fail in the guards below, not abort
      # silently inside the pipeline.)
      - name: Resolve the pinned Flutter version (same parse as the F-Droid recipe)
        id: flutter-pin
        run: |
          pinned="$(grep -v '^#' tool/flutter-version | tail -n 1)"
          [ -n "$pinned" ] || { echo "tool/flutter-version has no non-comment version line"; exit 1; }
          [[ "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tool/flutter-version pins '$pinned', expected a bare X.Y.Z version (inline-comment contamination or whitespace/CRLF?)"; exit 1; }
          echo "Resolved Flutter pin: $pinned"   # informational, not a gate
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.pinned }}
          # SDK cache keyed on version+channel: the same pin restores one
          # shared download across the workflows.
          cache: true
          # Same 'false' pub-cache semantics as in ci.yml.
          pub-cache: 'false'

      - name: Install dependencies
        run: flutter pub get

      # Both web/ sources are written against a base href of
      # /cycle-app/app/: the landing docs page owns the Pages root, so the
      # app must live one level below it or the shared URLs would collide.
      - name: Build web
        run: flutter build web --base-href /cycle-app/app/

      # Published under its URL paths: the landing page at the root, the
      # released demo under app/. Staging onto the fetched gh-pages tree
      # (by pathspec, never `git add .`) is what preserves the branch
      # deploys under branches/ owned by pages-branches.yml. The site
      # commit is authored via plumbing with no parent and force-pushed:
      # history stays a single deploy deep.
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth_git() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" "$@"
          }
          # pages/index.html is tracked in the app repo but absent from
          # the gh-pages tree, so both landing paths below (detach or
          # orphan `git rm`) wipe it out of the checkout; a copy outside
          # the repo survives the switch.
          cp -a pages "$RUNNER_TEMP/landing"
          rc=0
          git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null || rc=$?
          case $rc in
            0)
              auth_git fetch --depth 1 origin gh-pages
              git checkout -q --detach FETCH_HEAD
              ;;
            2)
              git checkout -q --orphan gh-pages-deploy
              git rm -rqf .
              ;;
            *)
              echo "Could not read refs/heads/gh-pages on the remote (git exit $rc)" >&2
              exit "$rc"
              ;;
          esac
          rm -rf app
          mkdir -p app
          cp "$RUNNER_TEMP/landing/index.html" index.html
          cp -a build/web/. app/
          # Branch-source publishing runs Jekyll processing unless this
          # marker exists at the root; the app's asset tree must be served
          # verbatim.
          touch .nojekyll
          git add -A -- index.html .nojekyll app
          tree=$(git write-tree)
          commit=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit-tree "$tree" -m "Publish web demo to Pages ($WEB_REF)")
          auth_git push -q --force origin "$commit:refs/heads/gh-pages"
