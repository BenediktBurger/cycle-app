name: Security

# Weekly OSV scan of the resolved dependency set (pubspec.lock) against the
# OSV.dev database; results land in the "Security > Code scanning" tab.
# CI also calls this workflow on every push/PR (fail-on-vuln true): findings
# fail the called workflow, which fails CI's ci-status gate job. Fork PRs
# get a read-only token, so the caller disables the Code-scanning upload;
# the scan still gates, results stay in the run's artifacts.
on:
  # Weekly Monday morning UTC run.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-sarif:
        description: "Whether to upload results to Security > Code scanning"
        type: boolean
        required: false
        default: true

permissions:
  # Required to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
  actions: read
  # Required to write results to the Security > Code scanning tab.
  security-events: write
  contents: read

jobs:
  dependency-vulnerabilities-osv:
    name: Dependency vulnerabilities (OSV)
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0"
    with:
      fail-on-vuln: true
      upload-sarif: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.upload-sarif }}
    permissions:
      actions: read
      security-events: write
      contents: read
