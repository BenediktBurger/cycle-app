name: Release

# Unsigned CI release builds for byte-reproducibility with the F-Droid
# buildserver. Triggered by push of a release/** branch (convention
# release/v<semver>) or by workflow_dispatch — NO tag exists at build time.
# The version in the artifact names comes from pubspec.yaml
# (`version: A.B.C+N` → A.B.C); the tag and the GitHub release are authored
# LATER, locally: tool/download_and_sign.dart downloads these artifacts,
# validates, signs, and stages them into build/gh-release/ (source.json
# manifest with this run's head SHA), and tool/publish_release.dart then
# runs `gh release create vX.Y.Z --target <the manifest's head SHA>` so
# that tag, release, and signed assets appear atomically at the exact
# commit CI built. The publish half runs only after the operator's device
# test passed between the two helpers.
# APKs are uploaded as workflow artifacts and signed LOCALLY (the release
# keystore never enters GitHub).
# Build happens at the default checkout path /home/runner/work/cycle-app/cycle-app —
# the fdroiddata recipe builds at exactly the same absolute path
# (reproducibility invariant; keep both in sync when the workspace name changes).
# NO --target-platform flag: plain --split-per-abi matches the fdroid recipe so
# the NativeAssetsManifest.json in every split is the 3-ABI form. No caching:
# outputs must stay byte-stable; caches can silently shift tool versions.
#
# No Release creation on CI — hence `contents: read` below; the Release itself
# is created locally by the publish script. A workflow_dispatch run on any branch is an
# ordinary full run: it builds the pubspec version of that checkout, and the
# branch name lands nowhere in the artifact names (the pubspec version is the
# source now, not the ref — there is no tag to derive a version from anyway).
# The fdroiddata recipe's checkout-path invariant above is unaffected: it
# checks out a commit, regardless of how that commit is addressed.
#
# The Gradle release build uses the documented debug-signing fallback
# (android/key.properties absent); apksigner replaces those signature blocks
# during local signing — they never reach the published assets.

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read   # artifact upload only; the Release itself is created locally

jobs:
  release-build:
    runs-on: ubuntu-latest
    # The pub cache must live at the same absolute path as on the F-Droid
    # buildserver: the recipe sets PUB_CACHE=$repo/.pub-cache, which resolves
    # to exactly this path via the checkout-path invariant in the header
    # comment. The Gradle/CMake build of jni's libdartjni.so bakes the
    # pub-cache absolute path into its output and thereby its GNU build-id.
    # A job-level env is the cleanest shape: one declaration covers every
    # step that may touch the cache (pub get and the Gradle build) without
    # duplicated per-step env.
    env:
      PUB_CACHE: /home/runner/work/cycle-app/cycle-app/.pub-cache
    steps:
      - uses: actions/checkout@v7        # → /home/runner/work/cycle-app/cycle-app

      - name: Set up JDK (pinned — must match the F-Droid buildserver JDK)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The pinned Flutter version lives in tool/flutter-version (one bare
      # version line under comments) and is read directly — the same file the
      # F-Droid build recipe parses from the built commit, with the same
      # parse. Shell expansion IS possible here: it runs in this run step,
      # then is rendered into the action input below via ${{ }}; the literal
      # flutter-version input is gone, so a Flutter bump edits
      # tool/flutter-version ONLY. (Deliberately no `set -o pipefail`: a
      # comment-only pin file must fail in the guards below, not abort
      # silently inside the pipeline.)
      - name: Resolve the pinned Flutter version (same parse as the F-Droid recipe)
        id: flutter-pin
        run: |
          pinned="$(grep -v '^#' tool/flutter-version | tail -n 1)"
          [ -n "$pinned" ] || { echo "tool/flutter-version has no non-comment version line"; exit 1; }
          [[ "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tool/flutter-version pins '$pinned', expected a bare X.Y.Z version (inline-comment contamination or whitespace/CRLF?)"; exit 1; }
          echo "Resolved Flutter pin: $pinned"   # informational, not a gate
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.pinned }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Full correctness gate (the same analyze/format/test parity gate the
      # signed pipeline ran before un-parking). No sqlite3mc vendoring check
      # here: that verifies the developer repo, not the build.
      - name: Analyze
        run: flutter analyze
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Test
        run: flutter test

      # The NDK must equal the flutter.ndkVersion that the Flutter pinned in
      # tool/flutter-version requests — and what the F-Droid buildserver's
      # sdkmanager auto-installs. The pin guards against runner-image drift
      # (ubuntu-latest preinstalls r27d) and against the sqlite3
      # native-assets build hook silently resolving another NDK. The env
      # export is defense-in-depth for that hook's compiler resolution; via
      # $GITHUB_ENV (not a job-level env) because $ANDROID_HOME must be
      # resolved at runtime, not at YAML render time.
      - name: Pin NDK (r28c)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build split APKs
        # NO --target-platform (see header comment); debug-signing fallback is fine.
        run: flutter build apk --release --split-per-abi

      # Verifies the hook-built libs (libsqlite3.so from the sqlite3
      # native-assets hook, libdartjni.so from Gradle/CMake) were compiled
      # with NDK r28c / clang 19.0.1, matching the F-Droid buildserver; the
      # content is read via `strings` because readelf note parsing is
      # brittle. Fail fast in CI instead of at F-Droid verification, where a
      # mismatch silently skips publishing.
      - name: Drift guard (toolchain fingerprints in the hook-built libs)
        run: |
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            for lib in "lib/${abi}/libsqlite3.so" "lib/${abi}/libdartjni.so"; do
              for pattern in "clang version 19.0.1" "13676358"; do
                if ! unzip -p "$apk" "$lib" | strings | grep -F "$pattern" >/dev/null; then
                  echo "Toolchain drift: $apk / $lib does not contain '$pattern' (expected NDK r28c, clang 19.0.1, 28.2.13676358)" >&2
                  exit 1
                fi
              done
            done
          done

      - name: Compute version (from pubspec — no tag exists at build time)
        id: ver
        run: |
          v="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?[[:space:]]*$/\1/p' pubspec.yaml | head -n 1)"
          [ -n "$v" ] || { echo "Could not read a 'version: A.B.C[+N]' line from pubspec.yaml (pre-release state? half-committed bump?)"; exit 1; }
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: cycle-app-${{ steps.ver.outputs.v }}-armeabi-v7a-unsigned
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: cycle-app-${{ steps.ver.outputs.v }}-arm64-v8a-unsigned
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: cycle-app-${{ steps.ver.outputs.v }}-x86_64-unsigned
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
