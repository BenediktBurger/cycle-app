name: Pages branch

# ADR-0012: publishes web builds of git branches under
# /cycle-app/branches/<slug>/ on the same gh-pages branch as the demo.
# Pushes to main redeploy branches/main/ automatically; every other
# branch deploys on dispatch (deploy + cleanup modes); a deleted branch's
# deploy is cleaned up automatically. Normal deploys write only under
# branches/<slug>/ — app/, .nojekyll, the landing page, and the Pages
# root belong to the Pages workflow. When gh-pages is absent (fresh
# setup, deletion, or a fork), the branch deploy creates the whole
# site in a single commit instead — landing page, .nojekyll, and the
# branch deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy this branch, or clean an existing deploy up
        required: true
        default: deploy
        type: choice
        options: [deploy, cleanup]
      slug:
        description: Explicit slug (defaults to the sanitized current branch name)
        required: false
        type: string
  delete:

# Shared with pages.yml: both write commits to gh-pages, so runs must
# serialize instead of cancelling each other mid-write.
concurrency:
  group: pages-deploy
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  deploy:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # The pushed branch's build code is untrusted, so no token may sit
        # in .git/config around it: the publish step below authenticates
        # its gh-pages git calls explicitly, after the build has run.
        with:
          persist-credentials: false

      # The slug names both a URL path segment and the directory published
      # to gh-pages, so it must be URL-safe on its own: sanitized here, and
      # guarded — an empty or non-[a-z0-9-] result fails the run instead of
      # publishing somewhere unexpected.
      - name: Resolve the branch slug
        id: slug
        env:
          REQUESTED_SLUG: ${{ inputs.slug }}
        run: |
          # Byte classes in ASCII only: a UTF-8 collation can pull
          # non-ASCII code points into [a-z] and let them through.
          export LC_ALL=C
          sanitize() {
            local candidate
            candidate="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')"
            [ -n "$candidate" ] && [[ "$candidate" =~ ^[a-z0-9-]+$ ]] || {
              echo "Branch slug '$candidate' (from '$1') is empty or not [a-z0-9-]" >&2
              exit 1
            }
            printf '%s\n' "$candidate"
          }
          if [ -n "${REQUESTED_SLUG:-}" ]; then
            slug="$(sanitize "$REQUESTED_SLUG")"
          else
            slug="$(sanitize "$GITHUB_REF_NAME")"
          fi
          echo "Resolved branch slug: $slug"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      # checkout@v7 fetches the run's commit by SHA, so this job still runs
      # after the branch was deleted post-deploy; only this check notices
      # the vanished branch and skips the redeploy instead of resurrecting
      # it (unauthenticated ls-remote suffices for the public repo); the
      # default arm keeps the case exhaustive, so `checked` is always
      # resolved before the gates below read it.
      - name: Check the source branch still exists on the remote
        id: source-branch
        run: |
          case "${GITHUB_REF:-}" in
            refs/heads/*)
              rc=0
              git ls-remote --exit-code origin "refs/heads/$GITHUB_REF_NAME" >/dev/null || rc=$?
              case $rc in
                0) echo "checked=true" >> "$GITHUB_OUTPUT" ;;
                2)
                  echo "Source branch '$GITHUB_REF_NAME' no longer exists on the remote — skipping the deploy"
                  echo "checked=false" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "Remote branch check failed (git exit $rc)" >&2
                  exit "$rc"
                  ;;
              esac ;;
            *)
              echo "Only branch refs publish branch previews — deploy a tag or commit SHA via the release workflow (pages.yml) with its ref input" >&2
              exit 1 ;;
          esac

      # Same key as in ci.yml (restore-key semantics commented there):
      # one shared cache entry — an identical-key save here is skipped,
      # not merged.
      - name: Restore pub cache
        if: steps.source-branch.outputs.checked != 'false'
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('tool/flutter-version') }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ hashFiles('tool/flutter-version') }}-

      # The pinned Flutter version lives in tool/flutter-version (one bare
      # version line under comments) and is read directly — the same file the
      # F-Droid build recipe parses from each built commit, with the same
      # parse. Shell expansion IS possible here: it runs in this run step,
      # then is rendered into the action input below via ${{ }}; the literal
      # flutter-version input is gone, so a Flutter bump edits
      # tool/flutter-version ONLY. (Deliberately no `set -o pipefail`: a
      # comment-only pin file must fail in the guards below, not abort
      # silently inside the pipeline.)
      - name: Resolve the pinned Flutter version (same parse as the F-Droid recipe)
        if: steps.source-branch.outputs.checked != 'false'
        id: flutter-pin
        run: |
          pinned="$(grep -v '^#' tool/flutter-version | tail -n 1)"
          [ -n "$pinned" ] || { echo "tool/flutter-version has no non-comment version line"; exit 1; }
          [[ "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tool/flutter-version pins '$pinned', expected a bare X.Y.Z version (inline-comment contamination or whitespace/CRLF?)"; exit 1; }
          echo "Resolved Flutter pin: $pinned"   # informational, not a gate
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        if: steps.source-branch.outputs.checked != 'false'
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.pinned }}
          # SDK cache keyed on version+channel: the same pin restores one
          # shared download across the workflows.
          cache: true
          # Same 'false' pub-cache semantics as in ci.yml.
          pub-cache: 'false'

      - name: Install dependencies
        if: steps.source-branch.outputs.checked != 'false'
        run: flutter pub get

      # The base href must equal the published URL path or every asset
      # request 404s: the app serves straight from branches/<slug>/.
      - name: Build web
        if: steps.source-branch.outputs.checked != 'false'
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: flutter build web --base-href /cycle-app/branches/$SLUG/

      # Normal deploys stage only this branch's directory by pathspec on
      # top of the fetched gh-pages tree; the bootstrap path below
      # (gh-pages absent) is the only writer of the root or .nojekyll.
      - name: Publish the branch deploy to gh-pages
        if: steps.source-branch.outputs.checked != 'false'
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The token is passed via this step's env, so it's absent from workflow
          # logs (runner redaction applies) — and nothing untrusted runs after the build.
          auth_git() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" "$@"
          }
          # pages/ is tracked in the build checkout but absent from the
          # gh-pages tree: both lands below (detaching onto it, or the
          # orphan rm when gh-pages is absent) wipe it out of the
          # worktree — the landing page travels through a copy outside
          # the repo.
          cp -a pages "$RUNNER_TEMP/landing"
          rc=0
          git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null || rc=$?
          case $rc in
            0)
              auth_git fetch --depth 1 origin gh-pages
              git checkout -q --detach FETCH_HEAD
              ;;
            2)
              # gh-pages is absent: the branch deploy creates the site
              # instead of failing. The landing page and .nojekyll are
              # staged here only (see the pathspec note above); pushing
              # a new gh-pages needs no --force.
              bootstrap=1
              git checkout -q --orphan gh-pages-deploy
              git rm -rqf .
              ;;
            *)
              echo "gh-pages is unreadable on the remote (git exit $rc)" >&2
              exit "$rc"
              ;;
          esac
          # Distinct branch names sanitize to the same slug (feature/x,
          # feature.x, Feature-X): a slug recorded for another branch's
          # marker must not be overwritten.
          if [ -f "branches/$SLUG/.preview-owner" ]; then
            owner="$(cat "branches/$SLUG/.preview-owner")"
            if [ "$owner" != "$GITHUB_REF_NAME" ]; then
              echo "Branch slug '$SLUG' is owned by branch '$owner' — '$GITHUB_REF_NAME' deploys to a different slug" >&2
              exit 1
            fi
          fi
          rm -rf "branches/$SLUG"
          mkdir -p "branches/$SLUG"
          cp -a build/web/. "branches/$SLUG/"
          printf '%s\n' "$GITHUB_REF_NAME" > "branches/$SLUG/.preview-owner"
          git add -A -- "branches/$SLUG"
          if [ -n "${bootstrap:-}" ]; then
            cp "$RUNNER_TEMP/landing/index.html" index.html
            # Branch-source publishing runs Jekyll processing unless this
            # marker exists at the root; the deploys must be served
            # verbatim.
            touch .nojekyll
            git add -A -- index.html .nojekyll
          fi
          if git diff --cached --quiet; then
            echo "branches/$SLUG already matches the served build — nothing to publish"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Publish branch $SLUG ($GITHUB_SHA)"
          auth_git push -q origin HEAD:refs/heads/gh-pages

  cleanup:
    if: >-
      (github.event_name == 'delete' && github.event.ref_type == 'branch') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'cleanup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # When gh-pages is absent, no branch deploy exists either, and a
      # cleanup for a deploy that was never published is not an error:
      # the job skips quietly instead of failing on the checkout below.
      - name: Check gh-pages exists on the remote
        id: gh-pages
        run: |
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "gh-pages does not exist yet — no branch deploys to clean up"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # No code build needed: only the published tree is touched.
      - uses: actions/checkout@v7
        if: steps.gh-pages.outputs.exists == 'true'
        with:
          ref: gh-pages
          path: site
          token: ${{ github.token }}
          persist-credentials: false

      - name: Resolve the branch slug
        if: steps.gh-pages.outputs.exists == 'true'
        id: slug
        env:
          EVENT_REF: ${{ github.event.ref }}
          REQUESTED_SLUG: ${{ inputs.slug }}
        run: |
          # Byte classes in ASCII only: a UTF-8 collation can pull
          # non-ASCII code points into [a-z] and let them through.
          export LC_ALL=C
          sanitize() {
            local candidate
            candidate="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9-]/-/g' -e 's/--*/-/g' -e 's/^-//' -e 's/-$//')"
            [ -n "$candidate" ] && [[ "$candidate" =~ ^[a-z0-9-]+$ ]] || {
              echo "Branch slug '$candidate' (from '$1') is empty or not [a-z0-9-]" >&2
              exit 1
            }
            printf '%s\n' "$candidate"
          }
          if [ "$GITHUB_EVENT_NAME" = delete ]; then
            # Delete events may carry the ref bare or as refs/heads/<name>.
            slug="$(sanitize "${EVENT_REF#refs/heads/}")"
          elif [ -n "${REQUESTED_SLUG:-}" ]; then
            slug="$(sanitize "$REQUESTED_SLUG")"
          else
            slug="$(sanitize "$GITHUB_REF_NAME")"
          fi
          echo "Resolved branch slug: $slug"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Remove the branch deploy
        if: steps.gh-pages.outputs.exists == 'true'
        working-directory: site
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          EVENT_REF: ${{ github.event.ref }}
          REQUESTED_SLUG: ${{ inputs.slug }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth_git() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" "$@"
          }
          # Identity-bearing cleanup contexts (branch delete, dispatch
          # without explicit slug) remove only their own branch's deploy;
          # a manual dispatch with an explicit slug is the operator's
          # escape hatch and skips the check. Pre-marker deploys (no owned
          # marker to compare) stay removable.
          if [ "$GITHUB_EVENT_NAME" = delete ]; then
            expected_owner="${EVENT_REF#refs/heads/}"
          elif [ -z "${REQUESTED_SLUG:-}" ]; then
            expected_owner="$GITHUB_REF_NAME"
          fi
          owner_file="branches/$SLUG/.preview-owner"
          if [ -n "${expected_owner:-}" ] && [ -f "$owner_file" ]; then
            recorded_owner="$(cat "$owner_file")"
            if [ "$recorded_owner" != "$expected_owner" ]; then
              echo "branches/$SLUG/ is owned by branch '$recorded_owner', not '$expected_owner' — leaving it in place"
              exit 0
            fi
          fi
          rm -rf "branches/$SLUG"
          # Tidy the now-dangling parent dir away when the last deploy left.
          rmdir branches 2>/dev/null || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing published under branches/$SLUG/ — nothing to clean up"
            exit 0
          fi
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Remove branch $SLUG"
          auth_git push -q origin HEAD:refs/heads/gh-pages
