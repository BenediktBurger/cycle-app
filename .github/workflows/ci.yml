name: CI

# ADR-0006: correctness gate for hand-written code — analyze, dart format,
# and test on every push/PR; a web build plus an Android debug build compile
# both shipping targets. development is the primary integration line, main
# the release line. Manual runs for convenience.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

# Superseded runs of the same branch are cancelled to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep equal to tool/flutter-version (single source of truth, enforced
      # by the gate below); shell expansion is not possible in action inputs.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4

      # The pinned Flutter version lives in tool/flutter-version (one bare
      # version line under comments) — the file the F-Droid build recipe
      # parses from each tagged commit. Fail the run loudly when the
      # workflow's Flutter above and that pin drift apart.
      - name: Flutter version matches tool/flutter-version
        run: |
          pinned="$(grep -v '^#' tool/flutter-version | tail -n 1)"
          installed="$(flutter --version | sed -n 's/^Flutter \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
          if [ "$installed" != "$pinned" ]; then
            echo "Flutter version mismatch: installed $installed, but tool/flutter-version pins $pinned."
            echo "Update tool/flutter-version (together with this workflow's flutter-version input) —"
            echo "the F-Droid recipe reads tool/flutter-version from the tagged release."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      # Feature parity of the vendored sqlite3mc amalgamation (compiled by
      # the build hook) with what the `sqlite3` package pins in its own
      # tooling at the lockfile version — drift here silently changes every
      # bundled cipher. Needs network (plain dart:io HTTP) and the .dart_tool
      # download cache created by pub get above. Developer-repo check only:
      # it is NOT part of the F-Droid buildserver recipe (docs/release.md
      # Phase E), where builds stay network-free.
      - name: sqlite3mc vendoring check
        run: dart run tool/sqlite3mc.dart check

      - name: Analyze
        run: flutter analyze

      # Mirrors the local doc gate (see CONTRIBUTING.md): CI fails on
      # unformatted files, no leniency.
      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      # No system sqlite3 install needed: the host-VM database tests use the
      # SQLite engine bundled by the sqlite3 package's build hook (the
      # `sqlite3mc` user-define in pubspec.yaml — see CONTRIBUTING.md,
      # "Linux note (database tests)").
      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web

      # Android debug build (unsigned, no signing config needed): compiles
      # the upcoming product target so regressions surface in CI, even
      # though the local Android toolchain is not yet green.
      # Accept the SDK licenses non-interactively first, otherwise the
      # build fails on the license prompt.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Build Android (debug)
        run: flutter build apk --debug
