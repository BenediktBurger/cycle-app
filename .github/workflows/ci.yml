name: CI

# ADR-0006: first real compile check for hand-written code —
# analyze + test + web build on every push/PR to main; manual runs for convenience.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # The drift tests use NativeDatabase on the host VM: the
      # sqlite3 dart package dlopens libsqlite3.so — install the dev lib
      # (ubuntu runners ship the runtime .so.0 but not the dev .so).
      - name: Install sqlite3 (host-VM database tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web
