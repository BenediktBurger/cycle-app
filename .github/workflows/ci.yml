name: CI

# ADR-0006: correctness gate for hand-written code — analyze, dart format,
# and test on every push/PR; a web build plus an Android debug build compile
# both shipping targets; a build_runner re-run must leave every committed
# *.g.dart file untouched. development is the primary integration line, main
# the release line. Manual runs for convenience.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

# Superseded runs of the same branch are cancelled to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Restore-keys match by string prefix; the pin hash leads the key so
      # the prefix can match, and an SDK bump restores nothing by design —
      # a pub cache built under a different SDK would be stale.
      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('tool/flutter-version') }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ hashFiles('tool/flutter-version') }}-

      # Gradle caches keyed on the lockfile (plugin versions come from the
      # lockfile's flutter dependencies), the pin, and the Android Gradle
      # config; restore-keys lets a config-only change still hit partial
      # dependencies. Not caching `build/`: the Gradle compile itself is
      # the gate.
      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('tool/flutter-version') }}-${{ hashFiles('android/**/gradle-wrapper.properties', 'android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The pinned Flutter version lives in tool/flutter-version (one bare
      # version line under comments) and is read directly — the same file the
      # F-Droid build recipe parses from each built commit, with the same
      # parse. Shell expansion IS possible here: it runs in this run step,
      # then is rendered into the action input below via ${{ }}; the literal
      # flutter-version input is gone, so a Flutter bump edits
      # tool/flutter-version ONLY. (Deliberately no `set -o pipefail`: a
      # comment-only pin file must fail in the guards below, not abort
      # silently inside the pipeline.)
      - name: Resolve the pinned Flutter version (same parse as the F-Droid recipe)
        id: flutter-pin
        run: |
          pinned="$(grep -v '^#' tool/flutter-version | tail -n 1)"
          [ -n "$pinned" ] || { echo "tool/flutter-version has no non-comment version line"; exit 1; }
          [[ "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tool/flutter-version pins '$pinned', expected a bare X.Y.Z version (inline-comment contamination or whitespace/CRLF?)"; exit 1; }
          echo "Resolved Flutter pin: $pinned"   # informational, not a gate
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.pinned }}
          # SDK cache keyed on version+channel: the same pin restores one
          # shared download across the workflows.
          cache: true
          # The string 'false' disables the action's own pub caching — the
          # actions/cache step above covers it — while `cache: true` keeps
          # the SDK cache. An empty value would instead fall back to
          # enabling the action's pub caching.
          pub-cache: 'false'

      - name: Install dependencies
        run: flutter pub get

      # Regenerate the committed .g.dart outputs (drift_dev +
      # riverpod_generator; why committed: CONTRIBUTING.md, "Codegen and
      # generated files") and fail on any diff — stale generated schema
      # still compiles, so analyze/test would not catch it.
      # Localizations are covered by `generate: true` (regenerated on every
      # pub get/build) and are gitignored besides.
      - name: Codegen freshness
        run: |
          dart run build_runner build
          git diff --exit-code -- '*.g.dart'

      # What the vendoring check fetches (the upstream pin script and the
      # amalgamation archive it names) is fixed by pubspec.lock, so a
      # lockfile-unchanged run restores the tool's URL-keyed download cache
      # and skips the network. The comparison itself cannot be masked: the
      # repo-side vendored files are the checkout's, fresh every run.
      - name: Restore sqlite3mc fetch cache
        uses: actions/cache@v4
        with:
          path: .dart_tool/sqlite3mc-cache
          key: sqlite3mc-fetch-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: sqlite3mc-fetch-${{ runner.os }}-

      # Feature parity of the vendored sqlite3mc amalgamation (compiled by
      # the build hook) with what the `sqlite3` package pins in its own
      # tooling at the lockfile version — drift here silently changes every
      # bundled cipher. Fetches over plain dart:io HTTP on a cache miss; the
      # .dart_tool directory itself comes from pub get above. Developer-repo
      # check only: it is NOT part of the F-Droid buildserver recipe
      # (docs/release.md Phase E), where builds stay network-free.
      - name: sqlite3mc vendoring check
        run: dart run tool/sqlite3mc.dart check

      - name: Analyze
        run: flutter analyze

      # Mirrors the local doc gate (see CONTRIBUTING.md): CI fails on
      # unformatted files, no leniency.
      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      # No system sqlite3 install needed: the host-VM database tests use the
      # SQLite engine bundled by the sqlite3 package's build hook (the
      # `sqlite3mc` user-define in pubspec.yaml — see CONTRIBUTING.md,
      # "Linux note (database tests)").
      - name: Test
        run: flutter test

      - name: Build web
        run: flutter build web

      # Android debug build (unsigned, no signing config needed): compiles
      # the upcoming product target so regressions surface in CI, even
      # though the local Android toolchain is not yet green. Single ABI:
      # the release workflow builds the full --split-per-abi set.
      # Accept the SDK licenses non-interactively first, otherwise the
      # build fails on the license prompt.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null

      - name: Build Android (debug)
        run: flutter build apk --debug --target-platform android-arm64

  # Re-runs the date-label tests on a UTC-negative host: date labels are
  # computed from UTC-midnight dates formatted verbatim, so nothing may
  # shift them into the host timezone (a toLocal() there reads the wrong
  # day). The main job's runner runs on UTC and never sees that failure,
  # so a dedicated job feeds Etc/GMT+5 through the environment. Only the
  # files that assert rendered date labels run here: the rest of the
  # suite is DateOnly-integer arithmetic and timezone-neutral by
  # construction, so running the full hostname-agnostic suite twice would
  # be wasteful. Duplicating checkout, Flutter setup and pub get is
  # cheaper than a second step in the main job, which also builds web and
  # Android — none of that is timezone-sensitive.
  test-on-utc-negative-host:
    runs-on: ubuntu-latest
    env:
      TZ: Etc/GMT+5
    steps:
      - uses: actions/checkout@v7

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('tool/flutter-version') }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ hashFiles('tool/flutter-version') }}-

      - name: Resolve the pinned Flutter version (same parse as the F-Droid recipe)
        id: flutter-pin
        run: |
          pinned="$(grep -v '^#' tool/flutter-version | tail -n 1)"
          [ -n "$pinned" ] || { echo "tool/flutter-version has no non-comment version line"; exit 1; }
          [[ "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tool/flutter-version pins '$pinned', expected a bare X.Y.Z version (inline-comment contamination or whitespace/CRLF?)"; exit 1; }
          echo "Resolved Flutter pin: $pinned"   # informational, not a gate
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.pinned }}
          # SDK cache keyed on version+channel: the same pin restores one
          # shared download across the workflows.
          cache: true
          # Same 'false' pub-cache semantics as the main job.
          pub-cache: 'false'

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: >
          flutter test --no-pub -r expanded
          test/diary_time_and_navigation_test.dart
          test/diary_cycle_day_label_test.dart
          test/diary_bleeding_marker_test.dart
          test/cycle_mark_sheet_test.dart
          test/dialog_and_shell_lifecycle_test.dart
          test/statistics_screen_test.dart
          test/domain/pdf_export_model_test.dart
