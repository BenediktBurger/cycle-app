name: cycle_app
# PLACEHOLDER package name (ADR-0002): rename = change this one line and re-run
# `flutter create --platforms=android,ios --project-name cycle_app .`.
description: >-
  Local-first cycle evaluation app (NER/Rötzer, INER). German-first with
  English support. No cloud, no analytics.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

# Version notes — all ranges float within their major/minor line so pub picks
# a version compatible with the installed SDK (resolved on Flutter 3.47.4 /
# Dart 3.13.3, 2026-09-15):
#
# flutter_riverpod: ^2.6.0 is a known-stable 2.x release. Deliberately stays on
#   the Riverpod 2.x line (3.x changes APIs).
# drift / drift_dev: ^2.35.0. Both bumped together in lockstep:
#   2.35 is also the version whose release ships the vendored web assets
#   (web/sqlite3.wasm + web/drift_worker.js) — keeping the runtime on the
#   same release line avoids wasm/worker binding mismatches. drift_dev runs
#   the codegen for the database (lib/db/*.g.dart via build_runner).
# sqlite3_flutter_libs: ^0.6.0. Bundles SQLite for native platforms so drift
#   works out of the box (referenced via sqlite3's ffi backend underneath
#   drift; drift_flutter brings it transitively too — kept as an explicit
#   dependency since ADR-0005 names it).
# drift_flutter: ^0.3.0. The drift-recommended `driftDatabase()` factory:
#   one line wires native (LazyDatabase over path_provider's application-
#   support directory + sqlite3_flutter_libs) AND web (drift WasmDatabase +
#   OPFS/IndexedDB probing) without hand-written conditional imports.
#   0.3.x requires the sqlite3 3.x line (matches drift 2.35); 0.2.x would
#   silently downgrade drift below 2.32. Justified further in
#   lib/db/database_opener.dart (openCycleDatabase).
# fl_chart: ^1.0.0. Temperature curve on the Zyklus screen.
# intl: any — flutter_localizations pins `intl` to the version matching the
#   installed Flutter SDK; `any` defers to that pin. This deliberately avoids a
#   hard failure when the SDK pins a different intl than a guessed caret range.
#   Pin it explicitly later (CONTRIBUTING.md) if so desired.
#
# Deliberately NOT here: sqlcipher_flutter_libs (ADR-005 — only when encryption
# is wired, later milestone), pdf/printing (deferred past M1), file pickers
# (M1 exports/imports are copy-to-clipboard + web download + paste, see
# lib/ui/settings.dart), and no Android-only plugins (ADR-003). ERROR
# NOTE: if this file ever reverts to "A new Flutter project" defaults, a
# `flutter create` run has clobbered it — restore from git history.

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.0
  drift: ^2.35.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0
  # Temperature curve chart; version range chosen to stay compatible
  # with the installed Flutter/Dart (resolved against Dart 3.13 — see lock).
  fl_chart: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.35.0
  # Direct dependency for the migration tests: they bootstrap a real v1-era
  # database file via the raw SQLite binding before drift's onUpgrade runs.
  sqlite3: ^3.5.0

flutter:
  uses-material-design: true
  # Required by Flutter 3.47: makes `flutter pub get`/`flutter test`/build run
  # `gen-l10n` automatically using l10n.yaml, so the real generated files under
  # lib/l10n (output configured in l10n.yaml) are produced before compile.
  generate: true
