name: cycle_app
# PLACEHOLDER package name (ADR-0002): rename = change this one line and re-run
# `flutter create --platforms=android,ios --project-name cycle_app .`.
description: >-
  Local-first cycle evaluation app (NER/Rötzer, INER). German-first with
  English support. No cloud, no analytics.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.12.0 <4.0.0"
  # Documents the true floor: the android plugin implementations of
  # url_launcher (6.3.33) and file_selector (0.5.2+11) require
  # Flutter >=3.44.0 — higher than any other resolved dependency, including
  # package_info_plus 10.2.1 (>=3.38.1).
  flutter: ">=3.44.0"

# Build-hook configuration: use SQLite3MultipleCiphers as the SQLite engine
# bundled by the sqlite3 package. `source: source` makes the hook COMPILE the
# amalgamation vendored under native/sqlite3mc/ (a package-supported mode; the
# prebuilt library it would otherwise download from a GitHub release would be
# the same code) — no network is needed at build time, which matters for
# F-Droid's build-from-source recipe (docs/release.md Phase E). This is what
# makes native database encryption work (ADR-005; drift ≥2.32 pattern, see
# lib/db/database_opener.dart). Provenance + refresh steps:
# native/sqlite3mc/README.md.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: native/sqlite3mc/sqlite3mc_amalgamation.c

# Version notes — all ranges float within their major/minor line so pub picks
# a version compatible with the installed SDK (resolved on Flutter 3.47.4 /
# Dart 3.13.3, 2026-09-15). The environment floor (Dart >=3.12.0, Flutter
# >=3.44.0) mirrors the highest floor among the resolved dependencies, currently
# the android plugin implementations of url_launcher / file_selector — see the
# comment on the environment itself:
#
# flutter_riverpod: ^2.6.0 is a known-stable 2.x release. Deliberately stays on
#   the Riverpod 2.x line (3.x changes APIs).
# drift / drift_dev: ^2.35.0. Both bumped together in lockstep:
#   2.35 is also the version whose release ships the vendored web assets
#   (web/sqlite3.wasm + web/drift_worker.js) — keeping the runtime on the
#   same release line avoids wasm/worker binding mismatches. drift_dev runs
#   the codegen for the database (lib/db/*.g.dart via build_runner).
# sqlite3_flutter_libs: ^0.6.0. Bundles SQLite for native platforms so drift
#   works out of the box (referenced via sqlite3's ffi backend underneath
#   drift; drift_flutter brings it transitively too — kept as an explicit
#   dependency since ADR-0005 names it).
# drift_flutter: ^0.3.0. The drift-recommended `driftDatabase()` factory,
#   now only used for the web path (drift WasmDatabase + OPFS/IndexedDB
#   probing): native opening is hand-rolled in lib/db/database_opener.dart
#   because it must apply the encryption key before use. 0.3.x requires the
#   sqlite3 3.x line (matches drift 2.35); 0.2.x would silently downgrade
#   drift below 2.32.
# fl_chart: ^1.0.0. Temperature curve on the Zyklus screen.
# flutter_secure_storage: ^11.2.0. Holds the native database encryption key
#   in the platform-protected store (Android Keystore / iOS Keychain) —
#   native only, web stays unencrypted (ADR-005).
# path_provider: ^2.1.6. Resolves the native database directory in
#   lib/db/database_opener.dart; transitive via drift_flutter before it
#   became a direct dependency of that opener.
# intl: any — flutter_localizations pins `intl` to the version matching the
#   installed Flutter SDK; `any` defers to that pin. This deliberately avoids a
#   hard failure when the SDK pins a different intl than a guessed caret range.
#   Pin it explicitly later (CONTRIBUTING.md) if so desired.
#
# File picking on the native targets ships via `file_selector` (dependency
# below); the web target keeps its own file input, exotic targets fall back
# to the paste-only stub (see lib/ui/file_transfer.dart).
#
# share_plus: ^13.3.0. The system share sheet for the JSON export — the
#   Android/iOS route to a real export file (the preview page used to offer
#   clipboard-only there, because free-form paths and home-directory writes
#   do not exist on Android and file_selector's Android SAF support covers
#   no save dialog). Only lib/ui/file_transfer_io.dart references it; web
#   keeps the browser download, the stub target the copy button.
#
# Native at-rest encryption is always-on: SQLite3MultipleCiphers is supplied
# as the sqlite3 engine via the build-hook user-define above and keyed in
# lib/db/db_key.dart (ADR-005) — no sqlcipher_flutter_libs involved.
# Deliberately NOT here: pdf/printing (deferred past M1), and no
# Android-only plugins (ADR-003). ERROR
# NOTE: if this file ever reverts to "A new Flutter project" defaults, a
# `flutter create` run has clobbered it — restore from git history.

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.0
  drift: ^2.35.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0
  # Temperature curve chart; version range chosen to stay compatible
  # with the installed Flutter/Dart (resolved against Dart 3.13 — see lock).
  fl_chart: ^1.0.0
  # Opening the INER contact links on the about/onboarding page in the
  # system browser/app; used together with package_info_plus below it is
  # one of the two plugin dependencies — the offline tracking paths never
  # touch either (tests fake/stub the platform calls to stay offline-safe).
  url_launcher: ^6.3.0
  # The app version for the about/onboarding page's version line: read from
  # the installed binary (the pubspec-mirror constant approach is deleted);
  # metadata-only plugin — it brings no network permissions, so the
  # offline-only posture holds.
  package_info_plus: ^10.1.0
  # File picker for the import dialogs on the native targets (SAF-backed on
  # Android); web keeps its own file input, the stub covers exotic targets.
  file_selector: ^1.1.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  # Raw SQLite binding, needed at runtime for lib/db/cipher_setup.dart (the
  # `PRAGMA cipher`/`PRAGMA key` steps the native opener applies) and by the
  # migration tests (they bootstrap older-version database files via the raw
  # binding before drift's upgrade runs on them).
  sqlite3: ^3.5.0
  # System share sheet for the JSON export on Android/iOS (file_selector's
  # Android implementation has no save dialog, so the share sheet is the
  # only Android route to a real export file — the copy button alone stays
  # the always-available fallback). Referenced only from
  # lib/ui/file_transfer_io.dart; the web target keeps its browser download.
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.35.0
  # Test-only: the recording fake in test/about_page_test.dart overrides
  # url_launcher's platform interface to keep the widget suite offline-safe;
  # the package itself arrives transitively with url_launcher.
  url_launcher_platform_interface: ^2.3.2
  # Regenerates the launcher icons (all Android/iOS mipmaps) from
  # design/icon.png (rendered from the design/logo.svg master): run
  # `dart run flutter_launcher_icons` after changing the source.
  flutter_launcher_icons: ^0.14.0

# Launcher-icon generation configuration (see the dev dependency above).
# Keep in sync with the roadmap items for the app logo and the adaptive
# launcher icon: this is the interim setup until a final logo lands.
flutter_launcher_icons:
  image_path: "design/icon.png"
  android: true
  ios: true
  # Apple's App Store rejects icons with an alpha channel; the master SVG
  # paints a white background, but the rendered PNG still carries the channel.
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "design/icon.png"

flutter:
  uses-material-design: true
  # Required by Flutter 3.47: makes `flutter pub get`/`flutter test`/build run
  # `gen-l10n` automatically using l10n.yaml, so the real generated files under
  # lib/l10n (output configured in l10n.yaml) are produced before compile.
  generate: true
