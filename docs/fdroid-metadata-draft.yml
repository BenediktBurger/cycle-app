Summary: >-
  Lokale Zyklusbewertung nach den NER-Regeln — Daten bleiben auf dem Gerät.
# Description mirrors fastlane/metadata/android/de-DE/full_description.txt
# (keep in sync when editing). F-Droid actually prefers the fastlane
# files when they exist; these fields are the fallback.
Description: >-
  Diese App unterstützt die Beobachtung des weiblichen Zyklus und dessen
  manuelle Auswertung nach den NER-Regeln (Rötzer), im Geiste der INER —
  als eigenständiges Werkzeug ohne jede Verbindung zur INER: Die App ist
  nicht von der INER geprüft, unterstützt oder empfohlen.


  Die Auswertung bleibt in Ihrer Hand: Sie setzen jede Markierung auf der
  Zykluskurve selbst. Die App übernimmt nur die Rechenarbeit, die Sie sonst
  von Hand ausführen würden — die Basislinie aus den sechs vorherigen
  niedrigen Messungen, Zählungen, Linien und Statistiken (Zyklus- und
  Phasenlängen). Sie rechnet und zeigt an; sie schlägt nichts vor und
  entscheidet nichts („unterstützte Markierung“, Modus M). Für eine
  zuverlässige Beurteilung der Fruchtbarkeit brauchen Sie
  Methodenkenntnisse — aus einem Lehrbuch oder einer Schulung.


  Alle Daten bleiben auf dem Gerät — keine Cloud, keine Analysewerkzeuge,
  keine Internet-Berechtigung. JSON-Export und JSON-Import in den
  Einstellungen. Oberfläche auf Deutsch, auf Englisch umschaltbar. Offene
  Quelle; lizenziert unter Apache-2.0.


  Hinweis: „NER Cycle App“ ist ein Arbeitstitel; der endgültige Name steht
  noch nicht fest. Der Package-Name `cycle_app` ist davon unberührt und
  bleibt ein interner Platzhalter.

